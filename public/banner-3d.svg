<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Animated Neon Color Cycle Gradient (Pure SMIL) -->
    <linearGradient id="neonGradientCycle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#ec4899;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#ec4899;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- 3D Keycap Faces -->
    <linearGradient id="keyTopSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="keyTopBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="keyTopPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <linearGradient id="keySideDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="keySideBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <!-- 3D Drop Shadow Filters -->
    <filter id="key3dShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid -->
    <pattern id="grid3d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.2" fill="#38bdf8" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Canvas Base with 3D Border & Metallic Accent -->
  <rect x="2" y="2" width="896" height="316" rx="24" fill="url(#bgGrad3D)" stroke="#334155" stroke-width="2" />
  <rect x="2" y="2" width="896" height="316" rx="24" fill="url(#grid3d)" />

  <!-- Animated Ambient Neon Light Glows in 3D Space -->
  <circle cx="160" cy="130" r="120" fill="#2563eb" opacity="0.18">
    <animate attributeName="r" values="100;140;100" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.14;0.25;0.14" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="480" cy="90" r="110" fill="#a855f7" opacity="0.16">
    <animate attributeName="r" values="90;130;90" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="180" r="130" fill="#06b6d4" opacity="0.15">
    <animate attributeName="r" values="110;150;110" dur="5.5s" repeatCount="indefinite" />
  </circle>

  <!-- Horizon Wave Beam with SMIL Pulse -->
  <path d="M 30 250 Q 450 215 870 250" fill="none" stroke="url(#neonGradientCycle)" stroke-width="2">
    <animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.5s" repeatCount="indefinite" />
  </path>

  <!-- ================= 3D ISOMETRIC FLOATING KEYCAPS (SMIL ANIMATED) ================= -->

  <!-- Keycap 1: 'W' (Blue Metallic 3D Keycap) -->
  <g transform="translate(65, 80)" filter="url(#key3dShadow)">
    <animateTransform attributeName="transform" type="translate"
                      values="65,80; 65,66; 65,80"
                      keyTimes="0; 0.5; 1"
                      dur="3.6s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <!-- 3D Extrusion Depth -->
    <path d="M 12 70 L 68 70 L 80 82 L 0 82 Z" fill="#0b1329" />
    <path d="M 68 20 L 80 30 L 80 82 L 68 70 Z" fill="#0f172a" />
    <rect x="0" y="10" width="68" height="60" rx="14" fill="url(#keySideBlue)" />
    <!-- Top Face with Bevel -->
    <rect x="4" y="4" width="60" height="52" rx="10" fill="url(#keyTopBlue)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="34" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" text-anchor="middle">W</text>
    <circle cx="54" cy="14" r="3" fill="#93c5fd" opacity="0.8" />
  </g>

  <!-- Keycap 2: 'P' (Purple 3D Keycap) -->
  <g transform="translate(145, 50)" filter="url(#key3dShadow)">
    <animateTransform attributeName="transform" type="translate"
                      values="145,50; 145,34; 145,50"
                      keyTimes="0; 0.5; 1"
                      dur="4.2s" begin="0.4s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <path d="M 12 70 L 68 70 L 80 82 L 0 82 Z" fill="#130924" />
    <path d="M 68 20 L 80 30 L 80 82 L 68 70 Z" fill="#1e1b4b" />
    <rect x="0" y="10" width="68" height="60" rx="14" fill="url(#keySideDark)" />
    <rect x="4" y="4" width="60" height="52" rx="10" fill="url(#keyTopPurple)" stroke="#c084fc" stroke-width="1.2" />
    <text x="34" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" text-anchor="middle">P</text>
    <circle cx="54" cy="14" r="3" fill="#e9d5ff" opacity="0.8" />
  </g>

  <!-- Keycap 3: 'M' (Slate Dark 3D Keycap) -->
  <g transform="translate(225, 80)" filter="url(#key3dShadow)">
    <animateTransform attributeName="transform" type="translate"
                      values="225,80; 225,67; 225,80"
                      keyTimes="0; 0.5; 1"
                      dur="3.8s" begin="0.8s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <path d="M 12 70 L 68 70 L 80 82 L 0 82 Z" fill="#080d1a" />
    <path d="M 68 20 L 80 30 L 80 82 L 68 70 Z" fill="#0f172a" />
    <rect x="0" y="10" width="68" height="60" rx="14" fill="url(#keySideDark)" />
    <rect x="4" y="4" width="60" height="52" rx="10" fill="url(#keyTopSlate)" stroke="#475569" stroke-width="1.2" />
    <text x="34" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="900" text-anchor="middle">M</text>
    <circle cx="54" cy="14" r="3" fill="#38bdf8" opacity="0.6" />
  </g>

  <!-- Keycap 4: Spacebar 3D Pill -->
  <g transform="translate(100, 185)" filter="url(#key3dShadow)">
    <animateTransform attributeName="transform" type="translate"
                      values="100,185; 100,174; 100,185"
                      keyTimes="0; 0.5; 1"
                      dur="4.4s" begin="1.2s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <rect x="0" y="8" width="160" height="36" rx="12" fill="#090d16" />
    <rect x="2" y="2" width="156" height="32" rx="10" fill="url(#keyTopSlate)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="80" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="4" text-anchor="middle">SPACEBAR</text>
  </g>

  <!-- ================= RIGHT SIDE: 3D SPEEDOMETER WITH ANIMATED GAUGE ================= -->

  <g transform="translate(740, 130)" filter="url(#glowSubtle)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="55" fill="#0f172a" stroke="#1e293b" stroke-width="10" />
    <!-- Dynamic Animated Speed Gauge (SMIL) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#neonGradientCycle)" stroke-width="10"
            stroke-dasharray="345" stroke-dashoffset="120" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" values="300; 70; 300" dur="6s" repeatCount="indefinite"
               calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </circle>
    <!-- Inner Gauge Face -->
    <circle cx="0" cy="0" r="42" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="-3" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle">128</text>
    <text x="0" y="15" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">WPM</text>
    <text x="0" y="27" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">99.4% ACC</text>
  </g>

  <!-- Floating 3D Micro Metric Chip -->
  <g transform="translate(675, 215)">
    <animateTransform attributeName="transform" type="translate"
                      values="675,215; 675,206; 675,215"
                      keyTimes="0; 0.5; 1"
                      dur="4.6s" begin="0.6s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <rect width="140" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <circle cx="16" cy="15" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">640 CPM • 100%</text>
  </g>

  <!-- ================= CENTER: TITLE, BADGES & INTERACTIVE TERMINAL ================= -->

  <!-- Top Pill: Status -->
  <g transform="translate(360, 42)">
    <rect width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="13" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" letter-spacing="1.5">
      PRO PRODUCTION ENGINE
    </text>
  </g>

  <!-- Main 3D Title with Glowing Cycle Gradient -->
  <text x="485" y="112" fill="url(#neonGradientCycle)" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="950" text-anchor="middle" letter-spacing="1.5">
    TYPING SPEED TEST
  </text>

  <!-- Subtitle -->
  <text x="485" y="146" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">
    ⚡ Real-Time WPM Engine • Live Accuracy • Mechanical Feedback
  </text>

  <!-- 3D Interactive Terminal Box -->
  <g transform="translate(325, 172)" filter="url(#glowSubtle)">
    <rect width="330" height="42" rx="21" fill="#030712" stroke="#475569" stroke-width="1.5" />
    <circle cx="20" cy="21" r="4" fill="#ef4444" />
    <circle cx="32" cy="21" r="4" fill="#eab308" />
    <circle cx="44" cy="21" r="4" fill="#22c55e" />

    <text x="62" y="26" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">
      test &gt; <tspan fill="#f1f5f9">type_with_precision</tspan>
    </text>

    <!-- Blinking 3D Cursor (SMIL) -->
    <line x1="264" y1="12" x2="264" y2="30" stroke="#c084fc" stroke-width="2.5">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Live Deployment Link Pill (Bottom Center) -->
  <g transform="translate(315, 236)">
    <rect width="350" height="34" rx="17" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5">
      <animate attributeName="stroke" values="#60a5fa;#a855f7;#38bdf8;#60a5fa" dur="4s" repeatCount="indefinite" />
    </rect>
    <!-- Launch Rocket Icon -->
    <path d="M 22 17 L 30 11 M 30 11 L 30 16 M 30 11 L 25 11" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="40" y="22" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">
      LIVE: typing-speed-checker-liard.vercel.app
    </text>
  </g>
</svg>
