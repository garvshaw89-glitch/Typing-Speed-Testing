<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="cardGrad3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="neonBlue3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="neonPurple3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="neonGreen3D" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="cardShadow3D" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="900" height="200" rx="16" fill="#090d16" />

  <!-- 3D Feature Card 1: Real-Time Engine (SMIL animated) -->
  <g transform="translate(30, 22)" filter="url(#cardShadow3D)">
    <animateTransform attributeName="transform" type="translate"
                      values="30,22; 30,12; 30,22"
                      keyTimes="0; 0.5; 1"
                      dur="3.8s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <rect width="260" height="155" rx="16" fill="url(#cardGrad3D)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="url(#neonBlue3D)" />
    <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">⚡</text>
    <text x="68" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Real-Time WPM</text>
    <text x="68" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">NET SPEED ALGORITHM</text>
    <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Standard 5-keystroke net score</text>
    <text x="20" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Instant CPM &amp; Live Accuracy</text>
    <text x="20" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Target goal alert banner</text>
  </g>

  <!-- 3D Feature Card 2: Interactive Ergonomics (SMIL animated) -->
  <g transform="translate(320, 22)" filter="url(#cardShadow3D)">
    <animateTransform attributeName="transform" type="translate"
                      values="320,22; 320,10; 320,22"
                      keyTimes="0; 0.5; 1"
                      dur="4.3s" begin="0.3s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <rect width="260" height="155" rx="16" fill="url(#cardGrad3D)" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="url(#neonPurple3D)" />
    <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">⌨️</text>
    <text x="68" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">3D Virtual Keyboard</text>
    <text x="68" y="52" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">FINGER GUIDE &amp; AUDIO</text>

    <!-- Animated Equalizer Audio Bars (SMIL) -->
    <rect x="200" y="110" width="5" height="14" rx="2" fill="#a855f7">
      <animate attributeName="height" values="10;24;10" dur="1s" repeatCount="indefinite" />
      <animate attributeName="y" values="114;100;114" dur="1s" repeatCount="indefinite" />
    </rect>
    <rect x="210" y="105" width="5" height="20" rx="2" fill="#38bdf8">
      <animate attributeName="height" values="12;28;12" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="112;96;112" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
    </rect>
    <rect x="220" y="100" width="5" height="26" rx="2" fill="#c084fc">
      <animate attributeName="height" values="16;32;16" dur="0.9s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="108;92;108" dur="0.9s" begin="0.4s" repeatCount="indefinite" />
    </rect>
    <rect x="230" y="108" width="5" height="16" rx="2" fill="#38bdf8">
      <animate attributeName="height" values="10;26;10" dur="1.1s" begin="0.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="114;98;114" dur="1.1s" begin="0.1s" repeatCount="indefinite" />
    </rect>
    <rect x="240" y="112" width="5" height="12" rx="2" fill="#a855f7">
      <animate attributeName="height" values="8;20;8" dur="1.3s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="116;104;116" dur="1.3s" begin="0.5s" repeatCount="indefinite" />
    </rect>

    <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Color-coded finger zones</text>
    <text x="20" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Mechanical audio synthesizer</text>
    <text x="20" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Live active key highlighting</text>
  </g>

  <!-- 3D Feature Card 3: Mobile & Analytics (SMIL animated) -->
  <g transform="translate(610, 22)" filter="url(#cardShadow3D)">
    <animateTransform attributeName="transform" type="translate"
                      values="610,22; 610,13; 610,22"
                      keyTimes="0; 0.5; 1"
                      dur="4s" begin="0.6s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
    <rect width="260" height="155" rx="16" fill="url(#cardGrad3D)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" />
    <rect x="20" y="20" width="36" height="36" rx="10" fill="url(#neonGreen3D)" />
    <text x="38" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">📱</text>
    <text x="68" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">100% Mobile Ready</text>
    <text x="68" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">TOUCH &amp; ANALYTICS</text>
    <text x="20" y="86" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Virtual mobile keyboard tap</text>
    <text x="20" y="108" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Historical WPM progression</text>
    <text x="20" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Shareable PNG scorecard export</text>
  </g>
</svg>
