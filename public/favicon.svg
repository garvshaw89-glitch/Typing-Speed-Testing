<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="leftOrangeFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="rightYellowFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  
  <!-- Navy Background Rounded Squircle (high contrast on all browser tabs) -->
  <rect width="512" height="512" rx="104" fill="#0b112c" />
  
  <!-- Left Wing (Warm Amber Orange Facet) -->
  <polygon
    points="170,136 235,136 193,262 239,262 201,376 96,246"
    fill="url(#leftOrangeFacet)"
  />
  
  <!-- Right Wing (Electric Yellow Facet) -->
  <polygon
    points="277,136 342,136 416,246 256,444 230,412 281,262 235,262"
    fill="url(#rightYellowFacet)"
  />
</svg>
